[package]
name = "Lumine-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumine_rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.106"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
# HTTP 服务（/api/chat/stream）：axum 走 hyper，SSE 直接用其内置 Event 编码
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
