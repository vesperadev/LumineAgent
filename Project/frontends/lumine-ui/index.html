<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- 图标：与 src-tauri/icons 同源，桌面壳与浏览器共用一套，避免控制台 404 噪音 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Lumine</title>
    <script>
      // 首帧主题镜像：本脚本是 src/theme/store.tsx 里 DEFAULTS 与 apply() 的镜像，
      // 默认值、白名单、钳制范围必须与 store 两处同步，否则首帧会和 React 接管后的值打架（闪色）。
      (function () {
        try {
          var raw = localStorage.getItem("lumine.ui.v1");
          var saved = raw ? JSON.parse(raw) : {};
          var mode =
            saved.mode === "light" || saved.mode === "dark" || saved.mode === "system"
              ? saved.mode
              : "light"; // store 的 DEFAULTS.mode
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var palettes = ["percho", "sand", "slate", "forest", "rose"];
          var wallpapers = ["none", "linen", "grid", "aurora"];
          var scales = ["90", "100", "110"];
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          if (palettes.indexOf(saved.palette) !== -1) root.dataset.palette = saved.palette;
          if (wallpapers.indexOf(saved.wallpaper) !== -1) root.dataset.wallpaper = saved.wallpaper;
          if (scales.indexOf(saved.fontScale) !== -1) root.dataset.fontScale = saved.fontScale;
          if (typeof saved.wallpaperOpacity === "number" && isFinite(saved.wallpaperOpacity)) {
            var opacity = Math.min(1, Math.max(0.15, saved.wallpaperOpacity));
            root.style.setProperty("--wallpaper-opacity", String(opacity));
          }
        } catch (error) {
          /* 隐私模式或损坏数据：退回默认主题，不影响渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
