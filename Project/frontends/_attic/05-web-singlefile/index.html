<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumine // terminal prototype</title>
<style>
  :root {
    --bg: #07080a;
    --panel: #0d1014;
    --line: #1b2129;
    --text: #cfd6e0;
    --dim: #6b7683;
    --accent: #ffbf47;
    --ok: #5be07a;
    --err: #ff6b6b;
    --mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    font-size: 12px;
    letter-spacing: .04em;
  }
  .brand { color: var(--accent); font-weight: 700; letter-spacing: .18em; }
  .brand::before { content: "◈ "; }
  .meta { color: var(--dim); }
  header .spacer { flex: 1; }
  select, button {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    background: #10151b;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
  }
  select:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 1px;
  }
  button:hover { border-color: #2c3a49; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px 8px;
    scrollbar-width: thin;
    scrollbar-color: #232b35 transparent;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: #232b35; }

  .turn { display: grid; grid-template-columns: 92px 1fr; gap: 10px; margin-bottom: 14px; }
  .who { color: var(--dim); font-size: 12px; text-align: right; padding-top: 1px; }
  .who.you { color: #8fb3d9; }
  .who.lumine { color: var(--accent); }
  .said { white-space: pre-wrap; word-break: break-word; }
  .said.you { color: #b8c2cf; }
  .said.lumine { color: var(--text); }
  .caret {
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--accent);
    vertical-align: -2px;
    animation: blink .9s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err { color: var(--err); white-space: pre-wrap; }
  .hint { color: var(--dim); }

  .empty { padding: 40px 8px; color: var(--dim); }
  .empty pre { color: var(--accent); font-size: 11px; line-height: 1.15; margin: 0 0 18px; opacity: .85; }
  .empty p { margin: 4px 0; }
  .empty kbd {
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; color: var(--text); font-size: 11px;
  }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 18px 12px;
  }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 180px;
    padding: 12px 14px;
    background: #10151b;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.5;
    overflow-y: auto;
  }
  textarea::placeholder { color: #4d5865; }
  .keys { margin-top: 8px; color: #4d5865; font-size: 11px; display: flex; gap: 16px; flex-wrap: wrap; }
  .keys b { color: var(--dim); font-weight: 400; }
</style>
</head>
<body>
<header>
  <span class="brand">LUMINE</span>
  <span class="meta" id="session">session · 1</span>
  <span class="spacer"></span>
  <span class="dot" id="dot"></span>
  <span class="meta" id="state">idle</span>
  <select id="model">
    <option value="deepseek-chat">deepseek-chat</option>
    <option value="deepseek-reasoner">deepseek-reasoner</option>
  </select>
  <button id="new">新会话</button>
</header>

<main id="view">
  <div class="empty" id="empty">
    <pre>
   _     _   _ __  __ ___ _  _
  | |   | | | |  \/  |_ _| \| |
  | |__ | |_| | |\/| || || .` |
  |____| \___/|_|  |_|___|_|\_|</pre>
    <p>零构建原型 · 单文件 HTML · 双击即用</p>
    <p>输入 <kbd>?</kbd> 看能做什么，或直接开始对话。</p>
    <p class="hint">当前为 Mock 模式：回复本地生成，不消耗额度。</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
    <button id="stop" disabled>停止</button>
  </div>
  <div class="keys">
    <b>Enter</b> 发送　<b>Shift+Enter</b> 换行　<b>Esc</b> 中断　<b>Ctrl+N</b> 新会话
  </div>
</footer>

<script>
(() => {
  const view = document.getElementById("view");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const stopBtn = document.getElementById("stop");
  const newBtn = document.getElementById("new");
  const modelSel = document.getElementById("model");
  const stateEl = document.getElementById("state");
  const dotEl = document.getElementById("dot");
  const sessionEl = document.getElementById("session");

  let session = 1;
  let history = [];
  let generating = false;
  let abort = null;

  const endpoint = window.LUMINE_ENDPOINT || "";

  function setState(text, live) {
    stateEl.textContent = text;
    dotEl.classList.toggle("live", !!live);
  }

  function atBottom() {
    return view.scrollHeight - view.scrollTop - view.clientHeight < 40;
  }

  function scrollDown() {
    view.scrollTop = view.scrollHeight;
  }

  function addTurn(role, text) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();

    const turn = document.createElement("div");
    turn.className = "turn";

    const who = document.createElement("div");
    who.className = "who " + (role === "user" ? "you" : "lumine");
    who.textContent = role === "user" ? "you" : "lumine";

    const said = document.createElement("div");
    said.className = "said " + (role === "user" ? "you" : "lumine");
    said.textContent = text;

    turn.append(who, said);
    view.append(turn);
    scrollDown();
    return said;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  // —— 本地 Mock：事件形状与真实 SSE 完全一致 ——
  async function* mockStream(prompt, model) {
    const plan = prompt.trim().toLowerCase();
    let text;
    if (plan === "?" || plan === "help") {
      text = "我能做的：\n1. 连续对话，保留上下文\n2. 切换模型（deepseek-chat / deepseek-reasoner）\n3. 生成中随时中断\n\n还没有接真实后端，所以回答来自本地剧本。";
    } else if (plan.includes("架构") || plan.includes("分层")) {
      text = "建议按四层切：\n\ntransport  —— 只负责 SSE 解码，产出事件\nsession    —— 消息历史、模型、中止信号\nui         —— 渲染，不知道网络存在\ncontract   —— 共享类型与错误码\n\n依赖方向单向：ui → session → transport。反过来的话，换后端就要改界面。";
    } else if (plan.includes("你好") || plan.includes("hi") || plan.includes("hello")) {
      text = "你好。这是路线 05：一个 index.html 装下全部逻辑，没有构建步骤。\n用来快速试视觉，不爽再往正式栈迁。";
    } else {
      text = `收到：「${prompt.trim()}」。\n\n这是 Mock 回复，按 ${model} 的口吻拼出来，用于验证流式渲染、中断与滚动行为。接入 /api/chat/stream 后这段外壳不用改。`;
    }
    for (const ch of text) {
      await new Promise((r) => setTimeout(r, 16 + Math.random() * 22));
      yield { type: "delta", text: ch };
    }
    yield { type: "done", usage: { prompt: prompt.length, completion: text.length } };
  }

  async function* remoteStream(prompt, model) {
    const res = await fetch(endpoint + "/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model,
        messages: [...history, { role: "user", content: prompt }],
      }),
      signal: abort?.signal,
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n\n");
      buf = lines.pop() ?? "";
      for (const line of lines) {
        const raw = line.replace(/^data: /, "").trim();
        if (raw) yield JSON.parse(raw);
      }
    }
  }

  async function submit() {
    const prompt = input.value.trim();
    if (!prompt || generating) return;

    const model = modelSel.value;
    addTurn("user", prompt);
    history.push({ role: "user", content: prompt });
    input.value = "";
    autoGrow();

    generating = true;
    sendBtn.disabled = true;
    stopBtn.disabled = false;
    setState("streaming", true);
    abort = new AbortController();

    const bubble = addTurn("assistant", "");
    const caret = document.createElement("span");
    caret.className = "caret";
    bubble.append(caret);

    let acc = "";
    try {
      const stream = endpoint ? remoteStream(prompt, model) : mockStream(prompt, model);
      for await (const ev of stream) {
        if (ev.type === "delta") {
          acc += ev.text;
          caret.remove();
          bubble.textContent = acc;
          bubble.append(caret);
          if (atBottom()) scrollDown();
        } else if (ev.type === "error") {
          throw new Error(ev.message || "生成失败");
        } else if (ev.type === "done") {
          break;
        }
      }
      history.push({ role: "assistant", content: acc });
    } catch (e) {
      caret.remove();
      if (e?.name === "AbortError") {
        bubble.textContent = acc + "\n\n[已中断]";
        history.push({ role: "assistant", content: acc });
      } else {
        const err = document.createElement("div");
        err.className = "err";
        err.textContent = "✗ " + (e?.message || String(e));
        bubble.after(err);
        // 关键：失败不吞输入，把用户原话放回输入框
        input.value = prompt;
        autoGrow();
        history.pop();
      }
      scrollDown();
    } finally {
      caret.remove();
      generating = false;
      sendBtn.disabled = false;
      stopBtn.disabled = true;
      abort = null;
      setState("idle", false);
      input.focus();
    }
  }

  function stop() {
    if (!generating) return;
    abort?.abort();
  }

  function newSession() {
    stop();
    history = [];
    session += 1;
    sessionEl.textContent = "session · " + session;
    view.innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<p>新会话已开始。</p><p class=\"hint\">上下文已清空。</p>";
    view.append(empty);
    input.focus();
  }

  sendBtn.addEventListener("click", submit);
  stopBtn.addEventListener("click", stop);
  newBtn.addEventListener("click", newSession);

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") stop();
    if (e.key === "n" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      newSession();
    }
  });

  setState("idle", false);
  input.focus();
})();
</script>
</body>
</html>
